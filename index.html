<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>难题有解 · 用教员的思想，指导当下的难题</title>
<style>
/* 楷体 web 字体（子集化，保证安卓手机也能显示楷体文字） */
@font-face{
  font-family:"QKai";
  src:url("https://zenith0097.github.io/nantiyoujie/fonts/kaiti-subset.woff2") format("woff2");
  font-weight:400;font-style:normal;font-display:swap;
}
:root{
  --bg:#f6f1e4; --ink:#2b2720; --ink-soft:#91897b; --line:#e4dcc8;
  --seal:#c8443a; --seal-deep:#a8322e; --seal-soft:rgba(200,68,58,.08);
  --card-w:560px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);background:var(--bg);overflow:hidden;
  /* 宣纸淡噪点 */
  background-image:radial-gradient(rgba(43,39,32,.028) 1px, transparent 1px);
  background-size:22px 22px;
}
#app{height:100%;display:flex;align-items:center;justify-content:center;padding:14px}
.screen{
  display:flex;flex-direction:column;align-items:center;justify-content:safe center;
  width:100%;max-width:var(--card-w);height:100%;gap:12px;
  animation:rise .45s ease both;overflow-y:auto;padding:10px 6px;
}
.screen.hidden{display:none!important}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ===== 品牌 ===== */
.brand{display:flex;flex-direction:column;align-items:center;gap:10px}
.brand-name{font-size:24px;font-weight:600;letter-spacing:16px;margin-right:-16px}
.brand-name .dot{color:var(--seal)}
.brand-line{width:30px;height:2px;background:var(--seal);border-radius:1px}
.brand-hook{font-size:15px;color:var(--seal-deep);letter-spacing:3px;text-indent:3px;font-weight:600}
.brand-sub{font-size:12px;color:var(--ink-soft);letter-spacing:1.5px;line-height:1.6;text-align:center;margin-top:2px}

/* ===== 金句筒（翻开的书：左右页 + 右页绕书脊翻页）===== */
.book-wrap{position:relative;width:150px;height:150px;display:flex;align-items:flex-end;justify-content:center;margin:2px 0}
.book{position:relative;width:132px;height:118px}
.bk-spine{position:absolute;left:50%;top:5%;height:90%;width:2px;margin-left:-1px;background:#cbbfa4;z-index:0}
.bk-left{position:absolute;left:0;top:0;width:50%;height:100%;z-index:1}
.bk-left svg{width:100%;height:100%}
.bk-right{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:left center;
  box-shadow:-2px 0 4px rgba(43,39,32,.08)}
.bk-right svg{width:100%;height:100%}
.bk-right.r1{z-index:4}
.bk-right.r2{z-index:3}
.bk-right.r3{z-index:2}
.book.flip .bk-right{animation:pageTurn .5s ease-in forwards}
.book.flip .r1{animation-delay:0s}
.book.flip .r2{animation-delay:.2s}
.book.flip .r3{animation-delay:.4s}
@keyframes pageTurn{
  0%{transform:scaleX(1);opacity:1}
  55%{transform:scaleX(.42);opacity:.95}
  100%{transform:scaleX(.05);opacity:0}
}

/* ===== 输入区 ===== */
.hint{font-size:13px;color:var(--ink-soft);letter-spacing:1px;text-align:center;margin-bottom:2px}
.ask-box{display:flex;flex-direction:column;align-items:center;gap:8px}
.qinput{
  font-family:inherit;font-size:15px;color:var(--ink);text-align:center;
  background:#fff;border:1.5px solid var(--line);border-radius:10px;
  padding:11px 16px;width:min(76vw,300px);outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.qinput:focus{border-color:var(--seal);box-shadow:0 0 0 3px rgba(200,68,58,.08)}
.qinput::placeholder{color:#c6bdaa}
/* 预制问题（不会写？点一个直接摇）——主流程下方的次级入口，轻量处理 */
.preset{width:100%;max-width:330px;display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:20px}
.preset-hint{font-size:11px;color:#b5a68a;letter-spacing:1px;display:flex;align-items:center;gap:10px}
.preset-refresh{
  font-family:inherit;font-size:11px;color:var(--seal-deep);letter-spacing:1px;
  background:none;border:1px solid rgba(200,68,58,.4);border-radius:999px;padding:3px 12px;cursor:pointer;
  transition:background .15s,color .15s;
}
.preset-refresh:hover{background:var(--seal-soft);color:var(--seal-deep)}
.preset-refresh:active{transform:translateY(1px)}
.preset-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}
.chip{
  font-family:inherit;font-size:12px;color:var(--ink-soft);letter-spacing:.5px;
  background:transparent;border:1px solid #e3dccb;border-radius:999px;padding:5px 13px;cursor:pointer;
  transition:border-color .15s,color .15s,background .15s;
}
.chip:hover{border-color:var(--seal);color:var(--seal-deep);background:#fff}
.chip:active{background:var(--seal-soft)}

/* 合作联系：页脚式小功能 */
.entry-row{display:flex;align-items:center;justify-content:center;gap:2px;margin-top:auto;padding-top:10px;opacity:.6;flex-wrap:nowrap}
.entry-sep{font-size:9px;color:#d8d0bc;flex:none}
.copyright{font-size:10px;color:#b5a68a;letter-spacing:1px;text-align:center;margin-top:6px;opacity:.8;flex:0 0 auto}
.coop-entry{
  font-family:inherit;font-size:10px;color:var(--ink-soft);letter-spacing:.3px;white-space:nowrap;
  background:none;border:none;padding:5px 3px;cursor:pointer;transition:color .15s;flex:0 0 auto;
}
.coop-entry:hover{color:var(--seal-deep);opacity:1}
/* 分享页面板内更紧凑 */
.share-panel .entry-row .coop-entry{padding:4px 2px;font-size:9.5px}

/* ===== 合作联系页 ===== */
#s-cooperate{padding:0 28px}
.coop-top{display:flex;align-items:center;gap:14px;padding:18px 0 4px}
.coop-back{font-family:inherit;font-size:13px;color:var(--ink-soft);background:none;border:none;padding:6px 0;cursor:pointer}
.coop-back:hover{color:var(--seal-deep)}
.coop-title{font-size:15px;font-weight:600;letter-spacing:4px;color:var(--ink)}
.coop-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.coop-qr{
  width:min(62vw,260px);height:min(62vw,260px);
  background:#fff;border:1.5px solid var(--line);border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(43,39,32,.08);
}
.coop-qr img{width:82%;height:82%;object-fit:contain}
.coop-qr.empty::after{content:"合作二维码待添加";font-size:12px;color:#c6bdaa;letter-spacing:1px}
.coop-qr img[src=""]{display:none}
.coop-hint{font-size:13px;color:var(--ink);letter-spacing:2px;text-indent:2px}
.coop-mail{font-size:21px;font-weight:700;color:var(--seal-deep);letter-spacing:1px;user-select:all;margin:0}
.coop-sub{font-size:11px;color:#b5a68a;letter-spacing:1px}
.btn-main{
  font-family:inherit;font-size:18px;font-weight:600;letter-spacing:6px;text-indent:6px;
  background:var(--seal);color:#fff;border:none;border-radius:12px;
  padding:15px 54px;cursor:pointer;
  box-shadow:0 6px 18px rgba(200,68,58,.22);
  transition:transform .12s,box-shadow .12s;
}
.btn-main:hover{transform:translateY(-1px)}
.btn-main:active{transform:translateY(1px)}
.btn-main:disabled{opacity:.5;cursor:default}
.btn-ghost{
  font-family:inherit;font-size:14px;letter-spacing:2px;color:var(--ink-soft);
  background:none;border:none;padding:8px 12px;cursor:pointer;
}
.btn-ghost:hover{color:var(--seal-deep)}
.book-link{position:fixed;top:14px;right:18px;z-index:10;
  font-size:12px;color:var(--ink-soft);letter-spacing:1px;
  background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;
  box-shadow:0 2px 8px rgba(43,39,32,.05);
}
.book-link:hover{color:var(--seal-deep);border-color:var(--seal)}

/* ===== 金句屏（浅色宣纸，一句话一屏） ===== */
#s-answer{background:transparent}
/* 封面/金句页共用：教员人像水印背景（内容浮在上层） */
.wm-bg{position:relative}
.wm-bg::before{
  content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:84%;max-width:440px;aspect-ratio:800/1029;pointer-events:none;z-index:0;
  background:url("https://zenith0097.github.io/nantiyoujie/images/maestro-wm.webp") center/contain no-repeat;
  opacity:1;
}
.wm-bg>*{position:relative;z-index:1}
/* 收藏按钮保持固定在右上角（不受水印层规则影响） */
.wm-bg .book-link{position:fixed;top:14px;right:18px;z-index:12}
#s-answer>.answer-inner{position:relative;z-index:1}
.answer-inner{
  width:100%;height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:space-between;padding:40px 26px 30px;position:relative;
  overflow-y:auto;overscroll-behavior:contain;
  animation:rise .5s ease both;
  transform-origin:left center;
}
.answer-inner.book-open{animation:bookOpen .78s cubic-bezier(.22,.85,.3,1) both}
@keyframes bookOpen{
  0%{transform:translateX(-46px) scaleX(.18);opacity:.1}
  55%{transform:translateX(-5px) scaleX(.97);opacity:1}
  100%{transform:translateX(0) scaleX(1);opacity:1}
}
.answer-inner>*{position:relative;flex-shrink:0}
/* 背景水印"句"字（填补短句空白，弱存在感） */
.answer-inner::before{
  content:"句";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:"QKai","Kaiti SC","STKaiti","KaiTi","Noto Serif SC","Noto Serif CJK SC","Songti SC","SimSun",serif;font-weight:700;
  font-size:340px;line-height:1;color:rgba(43,39,32,.035);pointer-events:none;
}
@media (max-width:767px){.answer-inner::before{font-size:260px}}
.answer-inner>*{position:relative}
.answer-top{display:flex;flex-direction:column;align-items:center;gap:10px}
.answer-level{
  font-size:13px;letter-spacing:5px;text-indent:5px;color:var(--seal-deep);
  border:1px solid rgba(200,68,58,.55);border-radius:4px;padding:4px 12px;
  background:rgba(200,68,58,.04);
  animation:stamp .45s .1s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes stamp{0%{transform:scale(2.1) rotate(-14deg);opacity:0}60%{transform:scale(.94)}100%{transform:scale(1)}}
.answer-echo{font-size:13px;color:var(--seal-deep);letter-spacing:1px;animation:rise .4s .18s ease both}
.answer-echo .tag{background:var(--seal-soft);border-radius:4px;padding:1px 8px;margin-right:4px}
.answer-quote{
  font-family:"QKai","Kaiti SC","STKaiti","KaiTi","Noto Serif SC","Noto Serif CJK SC","Songti SC","SimSun",serif;
  font-size:39px;line-height:1.85;letter-spacing:3px;font-weight:700;
  color:var(--ink);text-align:center;max-width:560px;
  animation:rise .6s .22s ease both;
}
@media (max-width:767px){.answer-quote{font-size:32px}}
.answer-source{font-size:13px;color:var(--ink-soft);letter-spacing:2px;animation:rise .5s .3s ease both}
/* 次层 */
.answer-more{
  width:100%;max-width:440px;display:none;flex-direction:column;align-items:center;gap:14px;
  padding-top:20px;border-top:1px solid var(--line);animation:rise .4s ease both;
}
.answer-more.open{display:flex}
.more-toggle{
  font-family:inherit;font-size:14px;letter-spacing:2px;
  color:var(--ink);background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:11px 22px;cursor:pointer;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 2px 10px rgba(43,39,32,.05);
  transition:border-color .15s,box-shadow .15s,transform .1s;
}
.more-toggle:hover{border-color:var(--seal);box-shadow:0 4px 14px rgba(200,68,58,.12)}
.more-toggle:active{transform:scale(.98)}
.more-toggle .mt-icon{
  font-family:"QKai","Kaiti SC","STKaiti","KaiTi","Noto Serif SC","Noto Serif CJK SC","Songti SC","SimSun",serif;
  font-size:12px;color:#fff;background:var(--seal);border-radius:4px;
  padding:2px 6px;letter-spacing:1px;
}
.more-toggle .mt-arrow{color:var(--ink-soft);font-size:12px;transition:transform .25s}
.more-toggle.open .mt-arrow{transform:rotate(180deg)}
.more-trans{font-size:15px;line-height:1.9;color:var(--ink);text-align:center;padding:2px 6px}
.yiji{display:flex;gap:30px;align-items:flex-start}
.yj-item{display:flex;flex-direction:column;align-items:center;gap:8px}
.yj-item .c{font-size:13px;line-height:1.45;max-width:96px;text-align:center;letter-spacing:1px;color:var(--ink)}
.seal-round{width:78px;height:78px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;flex:none}
.seal-round .t{font-family:"QKai","Kaiti SC","STKaiti","KaiTi","Noto Serif SC","Noto Serif CJK SC","Songti SC","SimSun",serif;font-size:15px;font-weight:700;line-height:1;white-space:nowrap;letter-spacing:0}
.seal-round.yi{background:var(--seal);color:#fff;transform:rotate(-4deg);box-shadow:0 3px 10px rgba(200,68,58,.25)}
.seal-round.ji{background:#fff;color:var(--seal-deep);border:2px solid var(--seal);transform:rotate(3deg)}
.answer-actions{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:360px;padding-top:6px}
.answer-actions .btn-again{
  font-family:inherit;font-size:16px;font-weight:600;letter-spacing:4px;text-indent:4px;
  background:var(--seal);color:#fff;border:none;border-radius:12px;
  width:100%;padding:14px 0;cursor:pointer;box-shadow:0 6px 18px rgba(200,68,58,.22);
}
.answer-actions .btn-again:active{transform:translateY(1px)}
.answer-actions .row{display:flex;gap:10px;width:100%}
.answer-actions .row button{
  flex:1;font-family:inherit;font-size:14px;letter-spacing:2px;
  color:var(--ink);background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:11px 0;cursor:pointer;transition:border-color .15s;
}
.answer-actions .row button:hover{border-color:var(--seal);color:var(--seal-deep)}
.answer-actions .row button:active{background:var(--seal-soft)}
.answer-actions .row button:disabled,.share-panel .row button:disabled{
  color:#bbb;border-color:#e5e0d6;background:#f7f4ee;cursor:default;
}

/* ===== 分享 ===== */
#s-share{gap:8px;justify-content:flex-start;padding-top:4px}
#s-share .screen-hd{font-size:12px;color:var(--ink-soft);letter-spacing:3px;flex:none}
.share-img{width:auto;height:min(52vh,500px);aspect-ratio:9/16;border-radius:12px;flex:none;
  box-shadow:0 18px 50px rgba(43,39,32,.16);background:#fff}
.save-tip{font-size:11px;color:#b5a68a;letter-spacing:1px}
.share-core{font-size:12px;color:var(--seal-deep);letter-spacing:2px;font-weight:600;margin:0 0 4px}
.share-panel{
  display:flex;flex-direction:column;gap:8px;width:100%;max-width:340px;flex:none;
  background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:12px 14px 8px;box-shadow:0 10px 28px rgba(43,39,32,.07);
}
.share-panel .btn-dl{
  font-family:inherit;font-size:16px;font-weight:600;letter-spacing:4px;text-indent:4px;
  background:var(--seal);color:#fff;border:none;border-radius:12px;
  width:100%;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 6px 16px rgba(200,68,58,.22);
}
.share-panel .btn-dl:active{transform:translateY(1px)}
.share-panel .row{display:flex;gap:10px;width:100%}
.share-panel .row button{
  flex:1;font-family:inherit;font-size:14px;letter-spacing:2px;
  color:var(--ink);background:#fff;border:1px solid var(--line);
  border-radius:12px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:border-color .15s,color .15s;
}
.share-panel .row button:active{background:var(--seal-soft)}
.share-panel .btn-again{
  font-family:inherit;font-size:15px;font-weight:500;letter-spacing:3px;text-indent:3px;
  color:var(--seal-deep);background:#fff;border:1px solid var(--seal);border-radius:12px;
  width:100%;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .15s;
}
.share-panel .btn-again:active{background:var(--seal-soft)}
.share-panel .entry-row{margin-top:0;padding-top:6px}
/* 矮屏：卡片更小，保证一屏装下不溢出 */
@media (max-height:740px){
  #s-share{gap:6px}
  .share-img{height:min(44vh,400px)}
  .share-panel{gap:6px;padding:10px 14px 6px}
  .share-panel .btn-dl{height:40px}
  .share-panel .row button,.share-panel .btn-again{height:38px}
}

/* ===== 收藏 ===== */
.panel{position:fixed;inset:0;background:rgba(43,39,32,.45);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.panel.hidden{display:none}
.panel-box{background:var(--bg);border-radius:16px;max-width:420px;width:100%;max-height:76vh;
  padding:24px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;
  box-shadow:0 20px 60px rgba(43,39,32,.25)}
.panel-box h3{font-size:18px;letter-spacing:4px;text-align:center;margin-bottom:4px}
.book-item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.5;
  display:flex;justify-content:space-between;gap:8px;align-items:flex-start;
  font-family:"QKai","Kaiti SC","STKaiti","KaiTi","Noto Serif SC","Noto Serif CJK SC","Songti SC","SimSun",serif}
.book-item .q{flex:1}
.book-item .src{font-size:11px;color:var(--ink-soft);display:block;margin-top:3px}
.book-item .del{background:none;border:none;color:var(--seal-deep);font-size:16px;cursor:pointer;font-family:inherit}
.panel-empty{text-align:center;color:var(--ink-soft);font-size:14px;padding:24px 0}
/* 反馈 */
.tip-msg{font-size:12px;color:var(--ink-soft);letter-spacing:.5px;line-height:1.6}
.tip-msg b{color:var(--seal-deep)}
.tip-in{font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%;box-sizing:border-box;color:var(--ink)}
.tip-ta{font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%;box-sizing:border-box;color:var(--ink);resize:none;line-height:1.5}
.tip-sub{font-family:inherit;font-size:15px;font-weight:600;letter-spacing:2px;background:var(--seal);color:#fff;border:none;border-radius:12px;height:44px;cursor:pointer}
.tip-sub:active{transform:translateY(1px)}
.tip-sub:disabled{background:#c9b8ad;cursor:default}
.toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%) translateY(10px);
  background:rgba(43,39,32,.92);color:#f6f1e4;font-size:13px;letter-spacing:1px;
  padding:10px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:all .3s;z-index:30}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 桌面 */
@media (min-width:768px){
  body{background-color:#efe8d6}
  .answer-quote{font-size:44px}
  .share-img{height:min(52vh,540px)}
}
</style>
</head>
<body>
<main id="app">

  <!-- 屏1 问事 -->
  <section id="s-home" class="screen wm-bg">
    <button class="book-link" id="btnBook">我的收藏</button>
    <header class="brand">
      <div class="brand-name">难题有解<span class="dot">。</span></div>
      <div class="brand-line"></div>
      <div class="brand-hook">用教员的思想，指导当下的难题</div>
    </header>

    <div class="book-wrap">
      <div class="book" id="book">
        <!-- 书脊线 -->
        <span class="bk-spine" aria-hidden="true"></span>
        <!-- 左页（固定） -->
        <div class="bk-left" aria-hidden="true">
          <svg viewBox="0 0 70 120">
            <path d="M70 22 Q54 12 30 16 L30 96 Q54 92 70 102 Z" fill="#f6efdd" stroke="#b5a68a" stroke-width="2.5" stroke-linejoin="round"/>
            <line x1="38" y1="40" x2="61" y2="35" stroke="#c9bda2" stroke-width="2" stroke-linecap="round"/>
            <line x1="38" y1="52" x2="61" y2="47" stroke="#c9bda2" stroke-width="2" stroke-linecap="round"/>

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 1800);
}
function beep(freq, dur, vol, when){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "triangle"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime + (when||0));
    g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + (when||0) + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(audioCtx.currentTime + (when||0)); o.stop(audioCtx.currentTime + (when||0) + dur + .02);
  }catch(e){}
}
// 品级由金句质量决定：A级顶级语录→上上品/上品，B级普通→中品（避免"上品配平淡句"）
function pickLevel(q){
  const f = q && q.famous;
  if (f === "A") return Math.random() < .4 ? "上上品" : "上品";
  return "中品";
}
function parseSource(src){
  const m = src.match(/《毛泽东选集》第([一二三四五六七])卷 · ([^·]+?)· (\d{4})/);
  if (!m) return {title: src, year: ""};
  return {title: m[2].trim(), year: m[3] + "年"};
}
function showScreen(name){
  Object.values(screens).forEach(s=>s.classList.add("hidden"));
  screens[name].classList.remove("hidden");
}

// 加权抽取：A 顶级语录优先
function pickFrom(pool){
  const a = pool.filter(x=>x.famous==="A");
  const b = pool.filter(x=>x.famous==="B");
  const roll = Math.random();
  if (roll < 0.65 && a.length) return a[Math.floor(Math.random()*a.length)];
  if (roll < 0.9 && b.length) return b[Math.floor(Math.random()*b.length)];
  return pool[Math.floor(Math.random()*pool.length)];
}

  for (const d of DECISIONS){
    for (const k of d.keys){
      if (text.includes(k) && (!best || k.length > best.keyLen)) best = {d, keyLen: k.length};
    }
  }
  if (best){
    let pool = best.d.pool.map(qt=>QUOTES.find(x=>x.q===qt)).filter(Boolean);
    // 同时命中领域：优先抽同主题类别的句子，提高契合度
    if (cat){
      const cp = pool.filter(x=>x.c===cat);
      if (cp.length) pool = cp;
    }
    if (pool.length) return {q: pickFrom(pool), matched: best.d.name, fields};
  }
  // 第二层：只有领域词（如只写"辞职"）→ 同类别经典语录 + 领域标注
  if (fields.length){
    const pool = cat ? QUOTES.filter(x=>x.c===cat) : QUOTES;
    return {q: pickFrom(pool.length ? pool : QUOTES), matched: "", fields};
  }
  return null;
}

let shaking = false;
function shake(){
  if (shaking) return; shaking = true;
  $("btnShake").disabled = true;
  // 翻书动画：书页翻动后揭晓金句
  const book = $("book");
  if (book){
    book.classList.remove("flip");
    void book.offsetWidth;
    book.classList.add("flip");
  }
  beep(180,.05,.08); beep(150,.05,.08,.14); beep(120,.05,.08,.28);
  setTimeout(()=>{
    beep(520,.14,.2); beep(780,.1,.12,.08);
    showAnswer();
    $("btnShake").disabled = false;
    shaking = false;
  }, 1250);
}
function showAnswer(){
  const question = $("qInput").value.trim() || "";
  const hit = drawByQuestion(question);
  current = hit ? hit.q : pickFrom(QUOTES);
  current.question = question;
  current.matched = hit ? hit.matched : "";
  current.fields = (hit && hit.fields) ? hit.fields : [];
  // 决策点命中：白话/宜忌用金句自带的（决策池内的句子自带解释）

  current.level = pickLevel(current.q);
  $("aLevel").textContent = current.level;
  const echo = $("aEcho");
  if (current.question){
    // 匹配透明化：决策点→应你之问+领域标注；未命中→随缘句
    let tag = current.matched ? `应你「${current.matched}」之问` : "此句·随缘";
    if (current.fields.length) tag += ` · ${current.fields.join(" / ")}`;
    echo.innerHTML = `<span class="tag">${tag}</span>${current.question}`;
    echo.classList.remove("hidden");
  } else { echo.classList.add("hidden"); }
  $("aQuote").textContent = current.q;
  // 字号自适应：短句大字不空，长句维持默认
  const qlen = [...current.q].length;
  const aq = $("aQuote");
  const m = innerWidth <= 767;
  if (qlen <= 10) aq.style.fontSize = m ? "46px" : "60px";
  else if (qlen <= 18) aq.style.fontSize = m ? "38px" : "50px";
  else aq.style.fontSize = "";
  $("aTrans").textContent = current.t || "（白话未生成）";
  $("aYi").textContent = current.yi;
  $("aJi").textContent = current.ji;
  $("answerMore").classList.remove("open");
  $("moreToggle").classList.remove("open");
  $("mtLabel").textContent = "白话与解读";
  refreshSaveBtns();
  showScreen("answer");
  // 翻书动画：金句页像翻书一样展开
  const ai = $("answerInner");
  ai.classList.remove("book-open");
  void ai.offsetWidth;
  ai.classList.add("book-open");
}
$("moreToggle").addEventListener("click", ()=>{
  const m = $("answerMore");
  m.classList.toggle("open");
  $("moreToggle").classList.toggle("open");
  $("mtLabel").textContent = m.classList.contains("open") ? "收起" : "白话与解读";
});

async function drawShare(q){
  const W = 1080, H = 1920;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  const SERIF = '"QKai","Kaiti SC","STKaiti","KaiTi","Noto Serif SC","Noto Serif CJK SC","Songti SC","SimSun",serif';
  const SANS = '"PingFang SC","Microsoft YaHei",sans-serif';
  const F = (s,w="")=>`${w} ${s}px ${SERIF}`.trim();
  const FN = (s,w="")=>`${w} ${s}px ${SANS}`.trim();
  const PUNCT = /[,，。！？；：、]/;

  // 教员线稿水印（分享图主视觉背景，预加载；失败不阻塞）
  let wmImg = null;
  try{
    const im = new Image();
    im.src = "https://zenith0097.github.io/nantiyoujie/images/maestro-wm.webp";
    await im.decode();
    wmImg = im;
  }catch(e){ wmImg = null; }

  // 底色（暖宣纸）
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#faf5ea"); g.addColorStop(1,"#f1ead9");
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // 淡噪点
  for (let i=0;i<1400;i++){
    ctx.fillStyle = `rgba(43,39,32,${Math.random()*.022})`;
    ctx.fillRect(Math.random()*W, Math.random()*H, 2, 2);
  }
  // 主视觉区背景：教员线稿水印（淡墨，签文浮在上层）
  if (wmImg){
    ctx.save();
    const wmw = 500, wmh = Math.round(wmw * 1029 / 800);
    ctx.drawImage(wmImg, W/2 - wmw/2, 752 - wmh/2, wmw, wmh);
    ctx.restore();
  } else {
    // 兜底：极淡"句"字
    ctx.save();
    ctx.globalAlpha = .04; ctx.fillStyle = "#2b2720";
    ctx.font = `700 900px ${SERIF}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("句", W/2, 752);
    ctx.restore();
  }

  // 上下朱红线（请柬式）
  ctx.fillStyle = "#c8443a";
  ctx.fillRect(0, 0, W, 12);
  ctx.fillRect(0, H-12, W, 12);
  ctx.strokeStyle = "rgba(200,68,58,.35)"; ctx.lineWidth = 1.5;
  ctx.strokeRect(46, 46, W-92, H-92);

  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";

  // ===== 顶部区（固定锚点） =====
  ctx.fillStyle = "#2b2720"; ctx.font = FN(64,"600");
  ctx.fillText("难题有解", W/2, 150);
  ctx.fillStyle = "#c8443a"; ctx.fillRect(W/2-34, 180, 68, 4);
  ctx.fillStyle = "#91897b"; ctx.font = FN(34);
  ctx.fillText("今日金句 · " + todayStr(), W/2, 236);
  if (q.question){
    ctx.fillStyle = "#c8443a";
    let qsize = 40; ctx.font = F(qsize);
    let qlines = wrapText(ctx, "问：" + q.question, W - 220);
    while (qlines.length > 2 && qsize > 30){ qsize -= 2; ctx.font = F(qsize); qlines = wrapText(ctx, "问："+q.question, W-220); }
    const qlh = qsize * 1.45;
    const qy0 = (qlines.length > 1 ? 312 : 334) - (qlines.length-1)*qlh/2 + qsize*0.8;
    qlines.forEach((ln,i)=>ctx.fillText(ln, W/2, qy0 + i*qlh));
  }

  // ===== 主视觉区：y 412-1092 固定（680 高），垂直居中 =====
  const MAIN_TOP = 412, MAIN_H = 680, MAIN_CX = W/2, MAIN_CY = MAIN_TOP + MAIN_H/2;
  const chars = [...q.q];
  const level = q.level || "上品";
  let vw = 0, vh = 0; // 视觉块尺寸（红章定位用）

  if (chars.length <= 12){
    // ---- 短句：大字横排（2行内），逐字排开 ----
    let size = 148;
    ctx.font = F(size,"700");
    let lines = wrapText(ctx, q.q, 830);
    while ((lines.length > 2 || lines.some(l=>[...l].filter(c=>!PUNCT.test(c)).length > 7)) && size > 96){
      size -= 8; ctx.font = F(size,"700"); lines = wrapText(ctx, q.q, 830);
    }
    const lh = size * 1.5;
    const totalH = lines.length * lh;
    let ty = MAIN_CY - totalH/2 + size * 0.82;
    ctx.fillStyle = "#2b2720";
    for (const ln of lines){
      const u = [...ln].map(c=>PUNCT.test(c)?0.5:1);
      const units = u.reduce((a,b)=>a+b,0);
      const unit = Math.min(size*1.12, 830/units);
      const tw = units * unit;
      let x = MAIN_CX - tw/2 + unit/2;
      [...ln].forEach((ch,i)=>{
        if (PUNCT.test(ch)){ ctx.font = F(Math.round(size*0.75),"700"); }
        else ctx.font = F(size,"700");
        ctx.fillText(ch, x, ty);
        x += u[i] * unit;
      });
      ty += lh;
    }
    vw = lines.reduce((m,l)=>Math.max(m,[...l].length*size), 200);
    vh = totalH;
  } else {
    // ---- 长句：竖排（右起） ----
    const perCol = 5;
    const cols = [];
    for (let i=0;i<chars.length;i+=perCol) cols.push(chars.slice(i,i+perCol));
    const maxColLen = Math.max(...cols.map(c=>c.length));
    let size = 92;
    size = Math.min(size, 780 / (cols.length * 1.18));
    size = Math.min(size, MAIN_H - 140 > 0 ? (MAIN_H-140) / (maxColLen * 1.42) : size);
    size = Math.max(size, 56);
    const colW = size * 1.18, lineH = size * 1.42;
    const totalW = cols.length * colW;
    const totalH = maxColLen * lineH;
    const startX = MAIN_CX + totalW/2 - colW;
    const startY = MAIN_CY - totalH/2 + size*0.8;
    ctx.font = F(size,"700");
    ctx.fillStyle = "#2b2720";
    cols.forEach((col, ci)=>{
      const x = startX - ci * colW;
      col.forEach((ch, ri)=>ctx.fillText(ch, x, startY + ri * lineH));
    });
    vw = totalW; vh = totalH;
  }

  // 品级红章（主视觉右上角）
  ctx.save();
  ctx.translate(MAIN_CX + vw/2 + 52, MAIN_CY - vh/2 - 6);
  ctx.rotate(-0.07);
  ctx.strokeStyle = "#c8443a"; ctx.lineWidth = 3;
  ctx.strokeRect(-26, -56, 52, 64);
  ctx.fillStyle = "#c8443a";
  ctx.fillRect(-22, -52, 44, 56);
  ctx.fillStyle = "#faf5ea"; ctx.font = `600 20px ${SERIF}`;
  [...level].forEach((ch,i)=>ctx.fillText(ch, 0, -28 + i*25));
  ctx.restore();

  // ===== 解读区（固定锚点）：白话 1190 + 宜忌 1440 =====
  ctx.fillStyle = "#4a453d"; ctx.font = F(32);
  let tl = wrapText(ctx, q.t || "", W-280);
  if (tl.length > 2){ ctx.font = F(28); tl = wrapText(ctx, q.t||"", W-280); }
  let ty2 = 1190;
  for (const ln of tl){ ctx.fillText(ln, W/2, ty2); ty2 += (tl.length>2?48:56); }

  const sealY = 1440;
  const sealR = 92;
  [ [W/2-118,"该做的",q.yi,true], [W/2+118,"先别急的",q.ji,false] ].forEach(([sx,tag,txt,solid])=>{
    ctx.save(); ctx.translate(sx, sealY); ctx.rotate(solid?-0.05:0.04);
    ctx.beginPath(); ctx.arc(0,0,sealR,0,Math.PI*2);
    if (solid){ ctx.fillStyle="#c8443a"; ctx.fill(); }
    else { ctx.strokeStyle="#c8443a"; ctx.lineWidth=4; ctx.stroke(); }
    ctx.textAlign="center";
    ctx.font = F(tag.length > 2 ? 26 : 44,"700"); ctx.fillStyle = solid?"#faf5ea":"#c8443a";
    ctx.fillText(tag, 0, -16);
    ctx.font = F(26); ctx.fillText(txt, 0, 34);
    ctx.restore();
  });

  // ===== 底部区（固定锚点） =====
  const footY = 1662;
  ctx.fillStyle = "#2b2720"; ctx.font = F(36);
  ctx.fillText("用教员的思想，指导当下的难题", W/2, footY);
  ctx.strokeStyle = "rgba(43,39,32,.12)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(90, footY + 44); ctx.lineTo(W-90, footY + 44); ctx.stroke();

  const qr = 148, qx = W/2 - qr - 24, qy = 1734;
  // 真二维码：白底框 + 二维码模块
  ctx.fillStyle = "#fff"; ctx.fillRect(qx - 8, qy - 8, qr + 16, qr + 16);
  try{
    const q = qrcode(0, "M");
    q.addData(DEPLOY_URL);
    q.make();
    const n = q.getModuleCount();
    const cell = qr / n;
    ctx.fillStyle = "#2b2720";
    for (let r=0;r<n;r++) for (let c=0;c<n;c++){
      if (q.isDark(r,c)) ctx.fillRect(
        Math.round(qx + c*cell), Math.round(qy + r*cell),
        Math.ceil((c+1)*cell) - Math.round(c*cell),
        Math.ceil((r+1)*cell) - Math.round(r*cell));
    }
  }catch(e){
    // 兜底：二维码生成失败时画占位块
    ctx.fillStyle = "#2b2720"; ctx.fillRect(qx, qy, qr, qr);
  }
  ctx.textAlign = "left";
  ctx.fillStyle = "#c8443a"; ctx.font = F(36);
  ctx.fillText("扫码匹配金句", qx + qr + 44, qy + 60);
  ctx.fillStyle = "#2b2720"; ctx.font = F(30);
  ctx.fillText("Zenith AI 研学社", qx + qr + 44, qy + 110);
  ctx.fillStyle = "#91897b"; ctx.font = F(20);
  ctx.fillText("抖音 · 公众号同名", qx + qr + 44, qy + 142);
  ctx.textAlign = "center";
  return cv;
}
function wrapText(ctx, text, maxW){
  const chars = [...text]; const lines = []; let cur = "";
  for (const ch of chars){
    const test = cur + ch;
    if (ctx.measureText(test).width > maxW && cur){ lines.push(cur); cur = ch; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

  ["btnSave","btnSave2"].forEach(id=>{ const el = $(id); if (el){ el.textContent = "已收藏 ✓"; el.disabled = true; } });
}
function refreshSaveBtns(){
  const inBook = loadBook().some(x=>x.q===current.q);
  ["btnSave","btnSave2"].forEach(id=>{ const el = $(id); if (el){ el.textContent = inBook ? "已收藏 ✓" : "收藏此句"; el.disabled = inBook; } });
}
$("btnSave").addEventListener("click", saveCurrent);
$("btnSave2").addEventListener("click", saveCurrent);
// 配新句后刷新收藏按钮状态（在新句渲染后调用）
function afterDraw(){ if (current) refreshSaveBtns(); }
$("btnBook").addEventListener("click", ()=>{ renderBook(); $("bookPanel").classList.remove("hidden"); });
$("btnBookClose").addEventListener("click", ()=>$("bookPanel").classList.add("hidden"));
$("bookPanel").addEventListener("click", e=>{ if (e.target===$("bookPanel")) $("bookPanel").classList.add("hidden"); });

/* 键盘 */
document.addEventListener("keydown", e=>{
  const editing = e.target && (e.target.tagName==="INPUT" || e.target.tagName==="TEXTAREA");
  // 空格匹配：只在非输入状态触发，输入法组合中（选词/上屏）绝不触发
  if (e.code==="Space" && !editing && !e.isComposing && !$("s-home").classList.contains("hidden")){ e.preventDefault(); shake(); }
  if (e.key==="Escape") $("bookPanel").classList.add("hidden");
});
// 输入框内回车=匹配（输入法选词回车不触发）
$("qInput").addEventListener("keydown", e=>{
  if (e.key==="Enter" && !e.isComposing && $("qInput").value.trim()){ shake(); }
});
</script>
</body>
</html>
